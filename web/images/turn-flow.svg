<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" width="820" height="340" role="img" aria-labelledby="ttl desc">
  <title id="ttl">The four-step mahjong turn loop</title>
  <desc id="desc">A turn moves from draw to discard to optional claim, repeated until a hand reaches four sets and one pair.</desc>
  <rect x="0" y="0" width="820" height="340" fill="#fffdf7"/>
  <rect x="14" y="14" width="792" height="312" rx="16" fill="none" stroke="#ddd2bd" stroke-width="2"/>

  <!-- centre hand shape -->
  <g>
    <rect x="306" y="118" width="208" height="104" rx="14" fill="#f6f1e6" stroke="#c8bba2" stroke-width="1.5"/>
    <text x="410" y="146" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#5c5348">target hand</text>
    <g font-family="Georgia, serif" font-size="20" fill="#1c1a17">
      <rect x="322" y="158" width="28" height="38" rx="5" fill="#fffdf7" stroke="#c8bba2"/><text x="336" y="184" text-anchor="middle">1</text>
      <rect x="356" y="158" width="28" height="38" rx="5" fill="#fffdf7" stroke="#c8bba2"/><text x="370" y="184" text-anchor="middle">2</text>
      <rect x="390" y="158" width="28" height="38" rx="5" fill="#fffdf7" stroke="#c8bba2"/><text x="404" y="184" text-anchor="middle">3</text>
      <rect x="430" y="158" width="28" height="38" rx="5" fill="#fffdf7" stroke="#c8bba2"/><text x="444" y="184" text-anchor="middle" fill="#b03a2e">中</text>
      <rect x="464" y="158" width="28" height="38" rx="5" fill="#fffdf7" stroke="#c8bba2"/><text x="478" y="184" text-anchor="middle" fill="#b03a2e">中</text>
    </g>
    <text x="410" y="212" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#5c5348">4 sets + 1 pair</text>
  </g>

  <!-- arrows around -->
  <g stroke="#2f6b4f" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M222 96 C 250 60, 300 52, 340 60"/>
    <path d="M592 96 C 600 130, 596 170, 590 196"/>
    <path d="M598 236 C 560 288, 470 296, 410 292"/>
    <path d="M250 236 C 214 280, 190 258, 184 214"/>
  </g>
  <g fill="#2f6b4f">
    <polygon points="340,60 328,52 330,68"/>
    <polygon points="590,196 582,206 598,206"/>
    <polygon points="410,292 422,284 418,300"/>
    <polygon points="184,214 176,204 192,204"/>
  </g>

  <!-- step labels -->
  <g font-family="Georgia, serif" text-anchor="middle">
    <text x="160" y="80" font-size="17" fill="#1c1a17">1 · Draw</text>
    <text x="160" y="100" font-size="12.5" fill="#5c5348">take one tile from the wall</text>

    <text x="660" y="120" font-size="17" fill="#1c1a17">2 · Discard</text>
    <text x="660" y="140" font-size="12.5" fill="#5c5348">put one tile face up</text>

    <text x="660" y="258" font-size="17" fill="#1c1a17">3 · Claim</text>
    <text x="660" y="278" font-size="12.5" fill="#5c5348">chow, pung or kong</text>

    <text x="160" y="258" font-size="17" fill="#1c1a17">4 · Win</text>
    <text x="160" y="278" font-size="12.5" fill="#5c5348">declare a legal hand</text>
  </g>

  <!-- footnote -->
  <text x="410" y="318" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#a9803a">claim priority: win &gt; kong &gt; pung &gt; chow</text>
</svg>
